[package]
name = "percept-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for percept-core: build, train, save, and reuse transformer models for scoring/ranking/transform tasks in the browser."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
percept-core = { path = "../percept-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
