<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerceptKit — agent-built perception models in your browser</title>
<style>
  :root {
    --bg:#09090b; --panel:#101013; --panel2:#18181b; --edge:#27272a;
    --fg:#e4e4e7; --dim:#a1a1aa; --faint:#52525b;
    --acc:#38bdf8; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 system-ui, sans-serif; }
  header { padding:16px 24px 0; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; letter-spacing:-.02em; }
  header p { margin:0; color:var(--dim); font-size:12.5px; }
  header a { color:var(--acc); text-decoration:none; }
  .wrap { padding:14px 24px 48px; }

  .goalbar { display:flex; gap:10px; align-items:stretch; margin:10px 0 14px; }
  #agGoal { flex:1; background:var(--panel); color:var(--fg); border:1px solid var(--edge);
    border-radius:8px; padding:12px 14px; resize:vertical; min-height:52px; font:13.5px/1.45 ui-monospace,Menlo,monospace; }
  #agGoal:focus { outline:1px solid var(--acc); border-color:var(--acc); }
  .goalbtns { display:flex; flex-direction:column; gap:8px; }
  button.primary { background:var(--acc); color:#082f49; border:none; padding:10px 22px;
    border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; }
  button.primary:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--edge);
    padding:8px 14px; border-radius:8px; cursor:pointer; font-size:12.5px; }
  button.ghost:hover { color:var(--fg); border-color:var(--faint); }

  #board { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); }
  @media (min-width:1500px) { #board { grid-template-columns:repeat(5, 1fr); } }
  .lane { background:var(--panel); border:1px solid var(--edge); border-radius:10px;
    padding:12px; min-height:150px; display:flex; flex-direction:column; }
  .lane.demo { grid-column:1 / -1; }
  @media (min-width:1500px) { .lane.demo { grid-column:auto; } }
  .lane-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .lane-title { font-size:11px; text-transform:uppercase; letter-spacing:.9px; color:var(--dim); font-weight:600; }
  .lane-count { font-size:10.5px; color:var(--faint); font-family:ui-monospace,monospace; }
  .lane-body { display:flex; flex-direction:column; gap:8px; flex:1; }
  .lane-empty { color:var(--faint); font-size:12px; font-family:ui-monospace,monospace; margin:auto; padding:18px 0; }

  .card { background:var(--panel2); border:1px solid var(--edge); border-left:3px solid var(--faint);
    border-radius:8px; padding:9px 11px; font-size:12.5px; }
  .card.running { border-left-color:var(--warn); }
  .card.ok { border-left-color:var(--good); }
  .card.error { border-left-color:var(--bad); }
  .card.blocked { border-left-color:#d97706; }
  .card-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card-name { font-family:ui-monospace,monospace; font-size:12px; color:var(--fg); }
  .chip { font-size:10px; padding:1px 8px; border-radius:999px; font-weight:600;
    text-transform:uppercase; letter-spacing:.4px; white-space:nowrap; }
  .chip.running { background:#3b2f0b; color:var(--warn); animation:pulse 1.2s infinite; }
  .chip.ok { background:#052e16; color:var(--good); }
  .chip.error { background:#450a0a; color:var(--bad); }
  .chip.blocked { background:#451a03; color:#fbbf24; }
  @keyframes pulse { 50% { opacity:.55; } }
  .card-detail { margin-top:5px; color:var(--dim); font-family:ui-monospace,monospace;
    font-size:11px; line-height:1.5; word-break:break-word; white-space:pre-wrap; }
  .card.error .card-detail { color:#fca5a5; }
  .card.blocked .card-detail { color:#fcd34d; }
  .card canvas { width:100%; background:#000; border:1px solid var(--edge); border-radius:6px; margin-top:6px; }
  .ag-download { display:inline-flex; align-items:center; gap:6px; background:#052e16; color:#bbf7d0;
    border:1px solid #166534; padding:6px 14px; border-radius:8px; text-decoration:none;
    font-size:12.5px; margin-top:8px; }
  .ag-download:hover { background:#14532d; }
  .iter-badge { background:var(--edge); color:var(--acc); border-radius:999px;
    padding:1px 9px; font-size:10.5px; font-weight:600; }
  .ag-stats { font:11.5px/1.5 ui-monospace,Menlo,monospace; color:var(--dim); margin-top:6px; }
  .ag-report-label { font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin:0 0 6px; }
  .probe-header { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .hidden { display:none !important; }

  details#rawlog { margin-top:14px; background:var(--panel); border:1px solid var(--edge); border-radius:10px; }
  details#rawlog summary { padding:10px 14px; cursor:pointer; color:var(--dim);
    font-size:11px; text-transform:uppercase; letter-spacing:.9px; }
  .report-pane { padding:10px 14px; max-height:340px; overflow:auto;
    font:12px/1.55 ui-monospace,Menlo,monospace; color:var(--dim); white-space:pre-wrap; }
  .status-line { color:var(--faint); font-size:12px; margin:2px 0 8px; font-family:ui-monospace,monospace; }
</style>
<script type="importmap">
{"imports":{
  "@earendil-works/pi-agent-core":"./node_modules/@earendil-works/pi-agent-core/dist/index.js",
  "@earendil-works/pi-ai":"./node_modules/@earendil-works/pi-ai/dist/index.js",
  "@earendil-works/pi-telemetry":"./node_modules/@earendil-works/pi-telemetry/dist/index.js",
  "@earendil-works/chord":"./node_modules/@earendil-works/chord/dist/index.js",
  "@earendil-works/chord/context":"./node_modules/@earendil-works/chord/dist/context/index.js",
  "typebox":"./node_modules/typebox/build/index.mjs",
  "typebox/compile":"./node_modules/typebox/build/compile/index.mjs",
  "typebox/value":"./node_modules/typebox/build/value/index.mjs",
  "partial-json":"./node_modules/partial-json/esm.js",
  "@earendil-works/pi-ai/utils/uuid":"./node_modules/@earendil-works/pi-ai/dist/utils/uuid.js",
  "diff":"./node_modules/diff/libesm/index.js",
  "ignore":"./node_modules/ignore/legacy-esm.js",
  "yaml":"./node_modules/yaml/browser-esm.js"
}}
</script>
</head>
<body>
<header>
  <h1>PerceptKit</h1>
  <p>agent-planned, in-browser transformer training · <a href="https://github.com/theabbie/PerceptKit">source</a> · <a href="https://github.com/theabbie/PerceptKit/packages">npm</a></p>
</header>
<div class="wrap">
  <div class="goalbar">
    <textarea id="agGoal" placeholder="describe a perception goal — e.g. score quality of drawn circle; classify noisy digits; detect overlapping text blocks" spellcheck="false"></textarea>
    <div class="goalbtns">
      <button id="agRun" class="primary" type="button">Run</button>
      <button id="agAbort" class="ghost" type="button">Abort</button>
    </div>
  </div>
  <div class="status-line" id="agStatus">loading wasm…</div>
  <main id="board">
    <section class="lane" id="lane-plan">
      <div class="lane-head"><span class="lane-title">1 · Plan</span><span class="lane-count" id="cnt-plan"></span></div>
      <div class="lane-body" id="body-plan"><div class="lane-empty">awaiting goal</div></div>
    </section>
    <section class="lane" id="lane-code">
      <div class="lane-head"><span class="lane-title">2 · Code</span><span class="lane-count" id="cnt-code"></span></div>
      <div class="lane-body" id="body-code"><div class="lane-empty">corruptor + probe fns</div></div>
    </section>
    <section class="lane" id="lane-train">
      <div class="lane-head"><span class="lane-title">3 · Train</span><span class="lane-count" id="cnt-train"></span></div>
      <div class="lane-body" id="body-train"><div class="lane-empty">dataset → wasm trainer</div></div>
    </section>
    <section class="lane" id="lane-eval">
      <div class="lane-head"><span class="lane-title">4 · Evaluate</span><span class="lane-count" id="cnt-eval"></span></div>
      <div class="lane-body" id="body-eval"><div class="lane-empty">held-out + probe</div></div>
    </section>
    <section class="lane" id="lane-export">
      <div class="lane-head"><span class="lane-title">5 · Export</span><span class="lane-count" id="cnt-export"></span></div>
      <div class="lane-body" id="body-export"><div class="lane-empty">.pkm artifact</div></div>
    </section>
    <section class="lane demo" id="lane-demo">
      <div class="lane-head"><span class="lane-title">6 · Live demo</span><span class="lane-count" id="cnt-demo"></span></div>
      <div class="lane-body" id="body-demo"><div class="lane-empty">train a model, then draw here</div></div>
    </section>
  </main>
  <details id="rawlog">
    <summary>raw run log</summary>
    <div class="report-pane" id="agLog"></div>
  </details>
</div>
<script src="./vendor/p5.min.js"></script>
<script type="module" src="./agent-ui.js?v=1.8"></script>
</body>
</html>
